<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBM Safe Crack</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#0e1116;--surface:#151a21;--surface-2:#1b212b;--border:#262e3a;--border-light:#323c4b;
  --text:#eef1f5;--text-2:#9aa5b4;--text-3:#6b7686;
  --violet:#a78bfa;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#38bdf8;
  --font:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--font);color:var(--text);user-select:none}
body{display:none}body.show{display:block}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,8,12,.55);backdrop-filter:blur(3px)}
.mg{width:440px;background:var(--bg);border:1px solid var(--border-light);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .24s ease}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);background:rgba(20,26,33,.6)}
.hd .ic{width:40px;height:40px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--violet) 14%,transparent);border:1px solid color-mix(in srgb,var(--violet) 30%,transparent)}
.hd .ic i{color:var(--violet);font-size:18px}
.hd .t{font-size:15px;font-weight:800}
.hd .t span{display:block;font-size:11.5px;font-weight:500;color:var(--text-3);margin-top:1px}
.hd .timer{margin-left:auto;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--green)}
.hd .timer.warn{color:var(--yellow)}.hd .timer.crit{color:var(--red)}
.body{padding:22px 20px 24px;display:flex;flex-direction:column;align-items:center}

/* combo pips */
.pips{display:flex;gap:10px;margin-bottom:18px}
.pip{width:52px;height:44px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--text-3);transition:all .2s}
.pip.active{border-color:var(--violet);color:var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 14%,transparent)}
.pip.done{background:color-mix(in srgb,var(--green) 12%,transparent);border-color:var(--green);color:var(--green)}

/* dial */
.dialwrap{position:relative;width:260px;height:260px;margin:4px 0 14px}
.dial{position:absolute;inset:0;border-radius:50%;background:
   radial-gradient(circle at 50% 40%, #232b36, #141922 70%);
  border:2px solid var(--border-light);box-shadow:inset 0 0 40px rgba(0,0,0,.6), 0 8px 30px rgba(0,0,0,.5)}
.dial canvas{position:absolute;inset:0}
.hub{position:absolute;top:50%;left:50%;width:88px;height:88px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#2a3340,#1a2029);border:1px solid var(--border-light);
  display:flex;align-items:center;justify-content:center;flex-direction:column}
.hub .val{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.hub .lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);margin-top:-2px}
/* pointer at top */
.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid var(--yellow);z-index:3;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

/* signal meter */
.signal{width:100%;margin-top:4px}
.signal .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.signal .bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.signal .bar > i{display:block;height:100%;border-radius:99px;width:0%;transition:width .06s linear, background .1s}
.strikes{display:flex;gap:6px;margin-top:14px}
.strk{width:12px;height:12px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-light)}
.strk.on{background:var(--red);border-color:var(--red)}
.hint{font-size:11.5px;color:var(--text-3);text-align:center;margin-top:16px;line-height:1.6}
.keycap{display:inline-block;min-width:20px;padding:2px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border-light);font-weight:700;font-size:11px;color:var(--text)}
.flash{position:fixed;inset:0;pointer-events:none;opacity:0}
.flash.go{animation:fl .4s ease}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}
</style></head>
<body class="sbm">
<div class="flash" id="flash"></div>
<div class="wrap"><div class="mg" id="mg">
  <div class="hd">
    <div class="ic"><i class="fa-solid fa-vault"></i></div>
    <div class="t">Safe Crack<span id="sub">Find the combination by feel</span></div>
    <div class="timer" id="timer">0:30</div>
  </div>
  <div class="body">
    <div class="pips" id="pips"></div>
    <div class="dialwrap">
      <div class="pointer"></div>
      <div class="dial"><canvas id="ticks" width="260" height="260"></canvas></div>
      <div class="hub"><div class="val" id="dialval">0</div><div class="lbl">dial</div></div>
    </div>
    <div class="signal">
      <div class="lbl"><span>Signal</span><span id="sigpct">0%</span></div>
      <div class="bar"><i id="sigbar"></i></div>
    </div>
    <div class="strikes" id="strikes"></div>
    <div class="hint">Turn the dial with <span class="keycap">A</span> <span class="keycap">D</span> (or scroll). Signal rises as you near a number — press <span class="keycap">Space</span> to lock it in.</div>
  </div>
</div></div>
<script>
var isFiveM=(typeof GetParentResourceName==='function');
function post(name,data){ if(!isFiveM)return; fetch('https://'+GetParentResourceName()+'/'+name,{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8'},body:JSON.stringify(data||{})}).catch(()=>{}); }
var inIframe=(window.parent!==window);
function report(win){ if(inIframe){ window.parent.postMessage({mg:'result',game:'safe',success:win},'*'); } else { post('minigameResult',{game:'safe',success:win}); } }

var S=null; // {combo:[..], tolerance, duration}
var dial=0, stage=0, strikes=0, locked=[], target=0, running=false, endAt=0, tickTimer=null, rafId=null;

function drawTicks(){
  var c=document.getElementById('ticks'), ctx=c.getContext('2d');
  ctx.clearRect(0,0,260,260);
  var cx=130,cy=130,R=118;
  for(var n=0;n<100;n++){
    var ang=(n/100)*Math.PI*2 - Math.PI/2 - (dial/100)*Math.PI*2;
    var big=(n%10===0);
    var r1=R-(big?16:9), r2=R;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(ang)*r1, cy+Math.sin(ang)*r1);
    ctx.lineTo(cx+Math.cos(ang)*r2, cy+Math.sin(ang)*r2);
    ctx.strokeStyle=big?'#5a6472':'#323c4b';
    ctx.lineWidth=big?2.5:1.2;
    ctx.stroke();
    if(big){
      var tr=R-30;
      ctx.fillStyle='#9aa5b4';ctx.font='700 12px Inter';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(n, cx+Math.cos(ang)*tr, cy+Math.sin(ang)*tr);
    }
  }
}
function dist(a,b){ var d=Math.abs(a-b)%100; return Math.min(d,100-d); }
function renderPips(){
  var el=document.getElementById('pips');el.innerHTML='';
  S.combo.forEach(function(_,i){
    var d=document.createElement('div');
    d.className='pip'+(i<stage?' done':'')+(i===stage?' active':'');
    d.textContent=(i<stage)?locked[i]:'•';
    el.appendChild(d);
  });
}
function renderStrikes(){
  var el=document.getElementById('strikes');el.innerHTML='';
  for(var i=0;i<3;i++){var d=document.createElement('div');d.className='strk'+(i<strikes?' on':'');el.appendChild(d);}
}
function updateSignal(){
  var d=dist(Math.round(dial), target);
  var tol=S.tolerance||6;
  var sig=Math.max(0, 1 - d/50); // 0..1 overall closeness
  sig=Math.pow(sig, 2.2); // sharpen near the target
  var pct=Math.round(sig*100);
  var bar=document.getElementById('sigbar');
  bar.style.width=pct+'%';
  var col = d<=tol ? 'var(--green)' : (d<=tol*2.5 ? 'var(--yellow)' : 'var(--red)');
  bar.style.background=col;
  document.getElementById('sigpct').textContent=pct+'%';
  document.getElementById('dialval').textContent=Math.round(dial);
}
function tick(){
  if(!running)return;
  var left=Math.max(0,(endAt-Date.now())/1000);
  var m=Math.floor(left/60), s=Math.floor(left%60);
  var el=document.getElementById('timer');
  el.textContent=m+':'+(s<10?'0':'')+s;
  el.className='timer'+(left<=5?' crit':left<=10?' warn':'');
  if(left<=0){ finish(false); }
}
function nextStage(){
  if(stage>=S.combo.length){ finish(true); return; }
  target=S.combo[stage];
  document.getElementById('sub').textContent='Number '+(stage+1)+' of '+S.combo.length;
  renderPips();
}
function attemptLock(){
  if(!running)return;
  var d=dist(Math.round(dial), target);
  var tol=S.tolerance||6;
  if(d<=tol){
    locked[stage]=Math.round(dial); // reveal the number they landed on (snap to target for clean UI)
    locked[stage]=target;
    stage++;
    var f=document.getElementById('flash');f.style.background='radial-gradient(circle,rgba(52,211,153,.4),transparent 70%)';f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
    nextStage();
  } else {
    strikes++;
    var f2=document.getElementById('flash');f2.style.background='radial-gradient(circle,rgba(248,113,113,.4),transparent 70%)';f2.classList.remove('go');void f2.offsetWidth;f2.classList.add('go');
    renderStrikes();
    if(strikes>=3) finish(false);
  }
}
function loop(){ updateSignal(); rafId=requestAnimationFrame(loop); }
function finish(win){
  running=false;
  if(tickTimer){clearInterval(tickTimer);tickTimer=null;}
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  var el=document.getElementById('mg');
  el.style.transition='box-shadow .3s';
  el.style.boxShadow='0 30px 80px rgba(0,0,0,.6), 0 0 0 2px '+(win?'var(--green)':'var(--red)');
  setTimeout(function(){
    document.body.classList.remove('show');
    report(win);
  }, 500);
}
function start(cfg){
  S=cfg; dial=0; stage=0; strikes=0; locked=[]; running=true;
  endAt=Date.now()+(S.duration||30000);
  document.body.classList.add('show');
  drawTicks(); renderStrikes(); nextStage(); updateSignal();
  if(tickTimer)clearInterval(tickTimer); tickTimer=setInterval(tick,200); tick();
  loop();
}
function turn(delta){ if(!running)return; dial=(dial+delta+100)%100; drawTicks(); updateSignal(); }
window.addEventListener('keydown',function(e){
  if(!running)return;
  if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft') turn(-1);
  else if(e.key==='d'||e.key==='D'||e.key==='ArrowRight') turn(1);
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();attemptLock();}
  else if(e.key==='Escape'){finish(false);}
});
window.addEventListener('wheel',function(e){ turn(e.deltaY>0?1:-1); },{passive:true});
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.action==='safecrack') start(d.data||{});
});
// browser preview
if(!isFiveM){ start({ combo:[42,17,88], tolerance:6, duration:30000 }); }
</script></body></html>
